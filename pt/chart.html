<script>
!function(){"use strict";
const t={"zh-CN":{chTitle:"图表生成",chDesc:"输入 CSV/JSON 数据或手动录入，一键生成柱状图/折线图/饼图，可导出 PNG，纯本地处理不上传",chData:"数据",chTabCsv:"CSV 粘贴",chTabManual:"手动录入",chCsvHint:"第一列为标签，其余列为数值（逗号分隔）",chSample:"加载示例数据",chTableHint:"点击单元格编辑",chType:"图表类型",chBar:"柱状图",chLine:"折线图",chPie:"饼图",chTitleLabel:"标题",chAccent:"强调色",chPrev:"图表预览",chPrevTitle:"预览区",chPrevDesc:"调整数据后图表实时更新",chRun:"导出 PNG",chNote:"• 全部在浏览器本地处理，数据不上传服务器\n• CSV 支持逗号/制表符分隔，支持中文表头\n• 饼图使用第一列标签 + 数值列",chNoData:"请先输入有效数据",chNoNum:"未找到数值列",chSample:"加载示例数据"},
en:{chTitle:"Chart Maker",chDesc:"Create bar / line / pie charts from CSV, JSON or manual entry. Export as PNG. 100% local",chTabCsv:"Paste CSV",chTabManual:"Manual Entry",chCsvHint:"First column = labels, rest = values (comma or tab separated)",chSample:"Load sample data",chTableHint:"Click cells to edit",chType:"Chart Type",chBar:"Bar",chLine:"Line",chPie:"Pie",chTitleLabel:"Title",chAccent:"Accent",chPrev:"Preview",chPrevTitle:"Preview",chPrevDesc:"Chart updates as you type",chRun:"Export PNG",chNote:"All processing is local; data never leaves your device\nCSV supports comma/tab/semicolon; Chinese headers OK\nPie uses first label column + first numeric column",chNo:"Please enter data first",chNoNum:"Need at least one numeric column"},
ja:{chTitle:"グラフ作成",chTitleLabel:"タイトル",chType:"グラフ種類",chBar:"棒グラフ",chLine:"折れ線",chPie:"円グラフ",chRun:"PNG 書き出し",chNo:"データを入力してください"},
ko:{chTitle:"차트 만들기",chTitleLabel:"제목",chType:"차트 유형",chBar:"막대",chLine:"꺾은선",chPie:"원형",chRun:"PNG 내보내기",chNo:"데이터를 입력하세요"},
es:{chTitle:"Creador de gráficos",chTitleLabel:"Título",chType:"Tipo",chBar:"Barras",chLine:"Líneas",chPie:"Circular",chRun:"Exportar PNG",chNo:"Introduce datos primero"},
fr:{chTitle:"Créateur de graphiques",chTitleLabel:"Titre",chType:"Type",chBar:"Barres",chLine:"Lignes",chPie:"Secteurs",chRun:"Exporter PNG",chNo:"Saisissez d'abord les données"},
de:{chTitle:"Diagramm-Ersteller",chTitleLabel:"Titel",chType:"Typ",chBar:"Balken",chLine:"Linien",chPie:"Kreis",chRun:"PNG exportieren",chNo:"Bitte Daten eingeben"},
pt:{chTitle:"Criador de gráficos",chTitleLabel:"Título",chType:"Tipo",chBar:"Barras",chLine:"Linhas",chPie:"Pizza",chRun:"Exportar PNG",chNo:"Insira os dados primeiro"}};
let lang=window.pageLang||"zh-CN";const $=s=>document.querySelector(s);const T=k=>(t[lang]&&t[lang][k])||t.en[k]||k;
const csvEl=$("#chCsv"),tableEl=$("#chTable"),prev=$("#chPrev"),ph=$("#chPh"),canvas=$("#chCanvas"),ctx=canvas.getContext("2d"),typeSeg=$("#chTypeSeg"),tabs=$("#chTabs"),csvSec=$("#chCsvSec"),manualSec=$("#chManualSec"),titleEl=$("#chTitle"),accentEl=$("#chAccent"),runBtn=$("#chRun");
let rows=null,dataMode="csv",chartType="bar";
const SAMPLE_CSV='月份,销量,利润\n1月,120,45\n2月,200,80\n3月,150,60\n4月,260,120\n5月,310,150';
const SAMPLE_MANUAL=[["产品","销量","利润"],["手机",320,90],["电脑",210,60],["平板",140,35],["耳机",260,80]];
function loadSample(){if(dataMode==="csv"){csvEl.value=SAMPLE_CSV;parseCsv();}else{rows=SAMPLE_MANUAL.map(r=>r.slice());renderTable();}draw();}
function parseCsv(){const raw=csvEl.value.trim();if(!raw)return rows=null;const lines=raw.split(/\r?\n/).filter(l=>l.trim());rows=lines.map(l=>l.split(/[,;\t]/).map(c=>c.trim()));}
function parseTable(){const trs=tableEl.querySelectorAll("tr");rows=[...trs].map(tr=>[...tr.querySelectorAll("input")].map(i=>i.value.trim()));}
function renderTable(){if(!rows)return;tableEl.innerHTML="";rows.forEach((r,ri)=>{const tr=document.createElement("tr");r.forEach((c,ci)=>{const td=document.createElement("td");if(ri===0){td.innerHTML="<b>"+esc(c)+"</b>";}else{const inp=document.createElement("input");inp.value=c;inp.addEventListener("input",()=>{rows[ri][ci]=inp.value;draw();});td.appendChild(inp);}tr.appendChild(td);});tableEl.appendChild(tr);});}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
// 取数值列
function numericCols(){if(!rows||rows.length<2)return[];const header=rows[0];const res=[];for(let ci=1;ci<header.length;ci++){let allNum=true;for(let ri=1;ri<rows.length;ri++){const v=rows[ri][ci];if(v===""||isNaN(Number(v))){allNum=false;break;}}if(allNum)res.push(ci);}return res;}
function draw(){
  if(dataMode==="csv")parseCsv();else parseTable();
  if(!rows||rows.length<2)return showPh();
  const cols=numericCols();if(!cols.length)return showPh();
  const header=rows[0],labels=rows.slice(1).map(r=>r[0]||"");
  const series=cols.map(ci=>({name:header[ci]||"",data:rows.slice(1).map(r=>parseFloat(r[ci])||0)}));
  const type=typeSegActive(),title=titleEl.value||header[0];
  const pad={top:60,right:40,bottom:60,left:64};
  ph.style.display="none";canvas.style.display="block";
  const W=Math.max(560,canvas.clientWidth-24)||760,H=Math.max(360,canvas.clientHeight-24)||480;
  canvas.width=W*2;canvas.height=H*2;canvas.style.width=W+"px";canvas.style.height=H+"px";
  const d=ctx;d.setTransform(1,0,0,1,0,0);d.clearRect(0,0,canvas.width,canvas.height);d.scale(2,2);
  d.fillStyle="#fff";d.fillRect(0,0,W,H);
  // 标题
  d.fillStyle="#1c2b45";d.font="700 20px sans-serif";d.textAlign="center";d.fillText(title, W/2,32);
  const accent=accentEl.value;
  if(type==="bar"){drawBar(d,W,H,pad,labels,series,accent);}
  else if(type==="line"){drawLine(d,W,H,pad,labels,series,accent);}
  else {drawPie(d,W,H,labels,series[0],accent);}
  canvas.dataset.ready="1";
}
function typeSegActive(){return typeSeg.querySelector(".active").dataset.cht;}
function drawBar(d,W,H,pad,labels,series,accent){
  const chartH=H-pad.top-pad.bottom,chartW=W-pad.left-pad.right;
  const maxVal=Math.max(...series.flatMap(s=>s.data),1);
  const colors=[accent,"#f59e0b","#10b981","#8b5cf6","#ef4444","#06b6d4"];
  const groups=labels.length,barW=Math.max(6,Math.min(40,chartW/groups/series.length*0.6));
  for(let gi=0;gi<labels.length;gi++){
    const gx=pad.left+chartW*gi/groups;
    series.forEach((s,si)=>{
      const h=chartH*s.data[gi]/maxVal;
      d.fillStyle=colors[si%colors.length];
      d.fillRect(gx+series.length*(barW+2),pad.top+chartH-h,barW,h);
    });
  }
  // 网格线 + Y 轴刻度
  d.strokeStyle="#e2e7ef";d.fillStyle="#728095";d.font="10px sans-serif";d.textAlign="right";
  for(let i=0;i<=4;i++){const y=pad.top+chartH-i*chartH/4;d.beginPath();d.moveTo(pad.left,y);d.lineTo(pad.left+chartW,y);d.stroke();d.fillText(Math.round(maxVal*i/4),pad.left-6,y+3);}
  // X轴标签
  d.textAlign="center";d.fillStyle="#42506b";d.font="11px sans-serif";
  labels.forEach((lb,gi)=>{const gx=pad.left+chartW*(gi+0.5)/groups;d.fillText(lb,gx,pad.top+chartH+16);});
}
function drawLine(d,W,H,pad,labels,series,accent){
  const padL=pad.left,padR=pad.right,padT=pad.top,padB=pad.bottom;
  const chartW=W-padL-padR,chartH=H-padT-padB;
  const maxVal=Math.max(...series.flatMap(s=>s.data),1);
  const colors=[accent,"#f59e0b","#10b981","#8b5cf6","#ef4444"];
  d.strokeStyle="#e2e2ef";d.lineWidth=1;d.fillStyle="#728095";d.font="10px sans-serif";d.textAlign="right";
  for(let i=0;i<=4;i++){const y=padT+chartH-i*chartH/4;d.beginPath();d.moveTo(padL,y);d.lineTo(padL+chartW,y);d.stroke();d.fillText(Math.round(maxVal*i/4),padL-6,y+3);}
  series.forEach((s,si)=>{
    const color=colors[si%colors.length];
    d.strokeStyle=color;d.lineWidth=2;d.beginPath();
    s.data.forEach((v,gi)=>{
      const x=padL+chartW*gi/(labels.length-1),y=padT+chartH*(1-v/maxVal);
      gi===0?d.moveTo(x,y):d.lineTo(x,y);
    });
    d.stroke();
    s.data.forEach((v,gi)=>{
      const x=padL+chartW*gi/(labels.length-1),y=padT+chartH*(1-v/maxVal);
      d.fillStyle=color;d.beginPath();d.arc(x,y,3,0,Math.PI*2);d.fill();
    });
  });
  d.textAlign="center";d.fillStyle="#42553b";d.font="11px sans-serif";
  labels.forEach((l,gi)=>{const x=padL+chartW*gi/(labels.length-1);d.fillText(l,x,padT+chartH+16);});
}
function drawPie(d,W,H,labels,series,accent){
  const cx=W/2,cy=H/2+6,r=Math.min(W,H)/2-40;
  const total=series.data.reduce((a,b)=>a+b,0);
  const colors=[accent,"#f59e0b","#10b981","#8b5cf6","#ef4444","#06b6d4","#f97316"];
  let start=-Math.PI/2;
  series.data.forEach((v,i)=>{
    const ang=v/total*Math.PI*2;
    d.fillStyle=colors[i%colors.length];d.beginPath();d.moveTo(cx,cy);d.arc(cx,cy,r,start,start+ang);d.closePath();d.fill();
    start+=ang;
  });
  // 图例
  d.font="11px sans-serif";d.textAlign="left";
  labels.forEach((l,i)=>{
    const ly=cy+r+24+i*18;
    d.fillStyle=colors[i%colors.length];d.fillRect(cx-r,ly,10,10);
    d.fillStyle="#42506b";d.fillText(l+"  "+(Math.round(series.data[i]/total*100))+"%",cx-r+16,ly+9);
  });
}
function showPh(){ph.style.display="";canvas.style.display="none";}
// 事件
tabs.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tabs.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");dataMode=b.dataset.ct;csvSec.style.display=dataMode==="csv"?"":"none";manualSec.style.display=dataMode==="manual"?"":"none";if(dataMode==="manual"&&!rows){rows=SAMPLE_MANUAL.map(r=>r.slice());renderTable();}draw();});
typeSeg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;typeSeg.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");draw();});
csvEl.addEventListener("input",debounce(draw,250));
titleEl.addEventListener("input",draw);
accentEl.addEventListener("input",draw);
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);}}
runBtn.addEventListener("click",()=>{if(!canvas.dataset.ready)return alert(T("chNo"));const a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download="chart_"+Date.now()+".png";a.click();});
// 初始化
if(dataMode==="csv"){parseCsv();}else{rows=SAMPLE_MANUAL.map(r=>r.slice());renderTable();}
draw();
setTimeout(()=>{document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t;const v=T(k);if(v&&k!=="brand"&&k!=="langLabel")el.textContent=v;});},50);
}();
