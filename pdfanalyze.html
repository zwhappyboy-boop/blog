<script>
(function(){
const WORKER_URL="https://api.zhouyixuan.com";
const MAX_CHARS=400000;
const MAX_PAGES=200;

if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

const container=document.querySelector('#pdf-app');
if(!container)return;
const fi=container.querySelector('#paFile');
const fl=container.querySelector('.fname');
const sheetsEl=container.querySelector('#paSheets');
const runBtn=container.querySelector('#paRun');
const stopBtn=container.querySelector('#paStop');
const statusEl=container.querySelector('#paStatus');
const outEl=container.querySelector('#paOut');
const modesEl=container.querySelector('#paModes');
const qwrap=container.querySelector('#paQwrap');
const qinput=container.querySelector('#paQuestion');
const progressEl=container.querySelector('#paProgress');
const progTextEl=container.querySelector('#paProgText');
const progFillEl=container.querySelector('#paProgFill');

function T(){return window.__tt?window.__tt():e.en}
function applyText(){
  const t=T();
  const q=qinput;
  if(q&&t.pdfQuestionPh)q.placeholder=t.pdfQuestionPh;
}

/* ===== 模式按钮 ===== */
let curMode='summary';
const MODES=[['summary','pdfModeSummary','pdfModeSummaryDesc'],['extract','pdfModeExtract','pdfModeExtractDesc'],['ask','pdfModeAsk','pdfModeAskDesc']];
function buildModes(){
  const t=T();
  modesEl.innerHTML='';
  MODES.forEach(m=>{
    const b=document.createElement('button');
    b.type='button';b.className='szbtn'+(m[0]===curMode?' active':'');
    b.innerHTML=(t[m[1]]||m[1])+'<span class="mdesc">'+(t[m[2]]||m[2])+'</span>';
    b.dataset.v=m[0];
    b.onclick=()=>{
      curMode=m[0];
      modesEl.querySelectorAll('.szbtn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      qwrap.classList.toggle('show',curMode==='ask');
      updateRunBtn();
    };
    modesEl.appendChild(b);
  });
}

/* ===== PDF 解析 ===== */
let textCache='';
let fileLoaded=false;
let fileCount=0;
let extractMethod='';

function showProgress(text,pct){
  progressEl.style.display='block';
  progTextEl.textContent=text;
  progFillEl.style.width=Math.round(pct)+'%';
}
function hideProgress(){progressEl.style.display='none'}

async function extractWithPDFJS(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const total=pdf.numPages;
  if(total>MAX_PAGES)throw new Error(T().pdfTooManyPages||'too many pages');
  const parts=[];
  for(let i=1;i<=total;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    const text=content.items.map(x=>x.str).join('');
    if(text.trim())parts.push('--- Page '+i+' ---\n'+text);
    showProgress((T().pdfExtracting||'Extracting')+' '+i+'/'+total,i/total*100);
  }
  return parts.join('\n\n');
}

async function extractWithUnstructured(file){
  showProgress(T().pdfUploading||'Uploading to cloud OCR...',10);
  let formData=new FormData();
  formData.append('file',file,file.name);
  let resp=await fetch(WORKER_URL+'/api/unstruct/extract',{method:'POST',body:formData});
  let data=await resp.json();
  if(!resp.ok||!data.jobId)throw new Error(data.error||'Unstructured extract failed');
  const jobId=data.jobId;
  showProgress(T().pdfOCRWaiting||'Cloud OCR processing...',20);
  for(;;){
    await new Promise(r=>setTimeout(r,3000));
    let sr=await fetch(WORKER_URL+'/api/unstruct/status?jobId='+encodeURIComponent(jobId));
    let sd=await sr.json();
    if(!sr.ok)throw new Error(sd.error||'Status check failed');
    let st=(sd.status||'').toLowerCase();
    if(st==='completed'&&sd.downloadUrl){
      showProgress(T().pdfDownloading||'Downloading results...',80);
      let dr=await fetch(WORKER_URL+'/api/unstruct/download?url='+encodeURIComponent(sd.downloadUrl));
      if(!dr.ok)throw new Error('Download failed');
      let blob=await dr.blob();
      let text=await blob.text();
      showProgress(T().pdfParsing||'Parsing results...',95);
      let parsed=parseUnstructuredJSON(text);
      return parsed;
    }
    if(st==='failed')throw new Error(T().pdfOCRFail||'OCR failed');
    showProgress((T().pdfOCRWaiting||'Cloud OCR processing...')+' ('+st+')',20);
  }
}

function parseUnstructuredJSON(jsonText){
  try{
    const data=JSON.parse(jsonText);
    if(Array.isArray(data)){
      const parts=[];
      for(const el of data){
        const type=el.type||'';
        const text=el.text||'';
        const md=el.metadata||{};
        const pn=md.page_number||'';
        let prefix='';
        if(pn)prefix='--- Page '+pn+' ---\n';
        if(type==='Title'&&text)parts.push('## '+text);
        else if(type==='Header'&&text)parts.push('### '+text);
        else if(text)parts.push(prefix+text);
      }
      return parts.join('\n\n');
    }
  }catch(err){}
  return jsonText;
}

async function parsePDF(file){
  let text=await extractWithPDFJS(file);
  if(text&&text.trim().length>50){
    extractMethod='PDF.js';
    return text;
  }
  // 文字太少，可能是扫描件，回退 Unstructured
  extractMethod='Unstructured';
  text=await extractWithUnstructured(file);
  return text;
}

/* ===== prompt 构建 ===== */
const LANG_NAME={'zh-CN':'Chinese','en':'English','ja':'Japanese','ko':'Korean','es':'Spanish','fr':'French','de':'German','pt':'Portuguese'};
function buildPrompt(mode,text,question){
  const pgLang=(window.pageLang||'zh-CN');
  const zh=(pgLang==='zh-CN');
  const langName=LANG_NAME[pgLang]||'English';
  let sys;
  if(zh){
    sys='你是一位资深文档分析专家，擅长从文档中提炼核心信息并输出专业分析。';
  }else{
    sys='You are a senior document analyst skilled at extracting key information and producing professional analysis.';
  }
  let task;
  if(mode==='summary'){
    task=zh
      ?'请对以下文档内容进行全面摘要，用中文输出，包含以下部分（用 markdown 格式，## 二级标题）：\n## 一、文档概述（类型、主题、篇幅、结构）\n## 二、核心要点（3-5 条关键结论，每条一句话概括）\n## 三、关键数据（涉及的重要数字、日期、金额、人名等）\n## 四、风险与注意事项（如有限制条款、风险提示等）\n## 五、行动建议（如适用，给出 2-3 条建议）\n要求：忠实原文、简洁专业、不编造内容。'
      :'Summarize the document below in '+langName+' with markdown sections: ## 1. Document Overview (type, topic, structure) ## 2. Key Points (3-5 main conclusions) ## 3. Key Data (important numbers, dates, names) ## 4. Risks & Cautions ## 5. Recommendations (if applicable). Be faithful to the source, concise, and professional.';
  }else if(mode==='extract'){
    task=zh
      ?'请从以下文档中提取关键结构化信息，用中文输出，用 markdown 格式：\n## 关键信息\n- 文档标题：\n- 文档类型：\n- 发文/签署日期：\n- 涉及金额：\n- 涉及方/机构：\n- 有效期限：\n- 关键条款：（逐条列出，每条标注页码）\n## 特别提示\n- 限制性条款：\n- 风险提示：\n如某项信息文档中未提及，标注"未提及"。不编造内容。'
      :'Extract key structured information from the document below in '+langName+' using markdown: ## Key Information (title, type, date, amounts, parties, validity period, key clauses with page numbers) ## Special Notes (restrictions, risk warnings). Mark "Not mentioned" if absent. Do not fabricate.';
  }else{
    const q=(question||'').trim();
    task=zh
      ?('用户问题：'+q+'\n请基于以下文档内容回答，要求：直接回答，先给结论再给依据，引用原文关键语句支撑；如文档内容不足以回答，明确说明缺什么信息。用中文回答。')
      :('User question: '+q+'\nAnswer based on the document below. Respond in '+langName+': conclusion first, then evidence with quotes from the source. If insufficient, say what is missing.');
  }
  const multiNote=fileCount>1?(zh?'\n\n注意：以下包含 '+fileCount+' 个文档，请进行跨文件联合分析，对比各文档之间的差异与关联。\n':'\n\nNote: The content below contains '+fileCount+' documents. Please perform cross-file joint analysis, comparing differences and correlations.\n'):'';
  return sys+'\n\n'+task+multiNote+'\n\n文档内容：\n```\n'+text+'\n```';
}

/* ===== SSE 流式请求 ===== */
let aborter=null;
async function streamAsk(prompt,onDelta){
  aborter=new AbortController();
  const resp=await fetch(WORKER_URL+'/api/gemini/ask',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt:prompt}),
    signal:aborter.signal
  });
  if(!resp.ok){
    let msg='HTTP '+resp.status;
    try{const j=await resp.json();msg=j.error||msg}catch(err){}
    throw new Error(msg);
  }
  const reader=resp.body.getReader();
  const dec=new TextDecoder();
  let buf='';
  for(;;){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true}).replace(/\r/g,'');
    let idx;
    while((idx=buf.indexOf('\n\n'))>=0){
      const chunk=buf.substring(0,idx);
      buf=buf.substring(idx+2);
      for(const line of chunk.split('\n')){
        if(line.startsWith('data:')){
          const payload=line.substring(5).trim();
          if(!payload||payload==='[DONE]')continue;
          try{
            const j=JSON.parse(payload);
            if(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts){
              for(const p of j.candidates[0].content.parts){if(p.text)onDelta(p.text)}
            }
            if(j.error)throw new Error(j.error.message||'stream error');
          }catch(err){if(err instanceof SyntaxError){}else throw err}
        }
      }
    }
  }
}

/* ===== 轻量 markdown 渲染 ===== */
function inline(t){
  return t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\*([^*\n]+)\*/g,'<i>$1</i>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>');
}
function mdRender(src){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let text=esc(src);
  const codeBlocks=[];
  text=text.replace(/```\s*\n?([\s\S]*?)```/g,(m,code)=>{
    codeBlocks.push('<pre><code>'+code.replace(/\n$/,'')+'</code></pre>');
    return '\x00B'+(codeBlocks.length-1)+'\x00';
  });
  const lines=text.split('\n');
  let html='',inList=false,listOl=false,tableBuf=[],para=[];
  const flushPara=()=>{if(para.length){html+='<p>'+inline(para.join('<br>'))+'</p>';para=[]}};
  const flushList=()=>{if(inList){html+='</ul>';inList=false;listOl=false}};
  const flushTable=()=>{
    if(!tableBuf.length)return;
    const rows=tableBuf.map(r=>{
      let s=r.trim();
      if(s.startsWith('|'))s=s.slice(1);
      if(s.endsWith('|'))s=s.slice(0,-1);
      return s.split('|').map(c=>c.trim());
    });
    if(rows.length>=2){
      html+='<div class="mdtable"><table><thead><tr>'+rows[0].map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>';
      for(let i=2;i<rows.length;i++){
        html+='<tr>'+rows[i].map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
      }
      html+='</tbody></table></div>';
    }else{
      html+='<p>'+tableBuf.map(inline).join('<br>')+'</p>';
    }
    tableBuf=[];
  };
  for(const raw of lines){
    const line=raw.trimEnd();
    if(/^\|.*\|/.test(line.trim())){flushPara();flushList();tableBuf.push(line);continue}
    flushTable();
    const ph=line.trim().match(/^\x00B(\d+)\x00$/);
    if(ph){flushPara();flushList();html+=codeBlocks[+ph[1]];continue}
    const h=line.match(/^(#{1,6})\s+(.*)/);
    if(h){flushPara();flushList();const lv=Math.min(h[1].length+1,6);html+='<h'+lv+'>'+inline(h[2])+'</h'+lv+'>';continue}
    const ul=line.match(/^[-*•]\s+(.*)/);
    if(ul){flushPara();if(!inList||listOl){flushList();html+='<ul>';inList=true;listOl=false}html+='<li>'+inline(ul[1])+'</li>';continue}
    const olm=line.match(/^\d+[.、)]\s+(.*)/);
    if(olm){flushPara();if(!inList||!listOl){flushList();html+='<ul class="ol">';inList=true;listOl=true}html+='<li>'+inline(olm[1])+'</li>';continue}
    if(!line.trim()){flushPara();flushList();continue}
    para.push(line);
  }
  flushTable();flushPara();flushList();
  html=html.replace(/\x00B(\d+)\x00/g,(m,i)=>codeBlocks[+i]);
  return html;
}

/* ===== 主流程 ===== */
let acc='';
let rafPending=false;

function renderStreaming(){
  if(rafPending)return;
  rafPending=true;
  requestAnimationFrame(()=>{
    rafPending=false;
    outEl.innerHTML=mdRender(acc)+'<span class="xa-cursor"></span>';
  });
}

function setStatus(msg,err){
  if(!msg){statusEl.style.display='none';return}
  statusEl.style.display='block';
  statusEl.textContent=msg;
  statusEl.classList.toggle('err',!!err);
}

function updateRunBtn(){
  const t=T();
  runBtn.disabled=!fileLoaded||!!aborter;
  if(curMode==='ask'&&acc){
    runBtn.textContent=t.pdfAskAgain||'Ask again';
  }else{
    runBtn.textContent=t.pdfRun||'Analyze';
  }
}

async function run(){
  if(!fileLoaded){alert(T().noFile||'no file');return}
  const t=T();
  let question='';
  if(curMode==='ask'){
    question=qinput.value.trim();
    if(!question){alert(t.pdfAskEmpty||'Please enter your question');qinput.focus();return}
  }
  acc='';
  outEl.innerHTML='';
  setStatus((t.pdfAnalyzing||'Analyzing...'),false);
  runBtn.disabled=true;
  stopBtn.style.display='inline-block';
  const mode=curMode;
  let text=textCache;
  let truncated=false;
  if(text.length>MAX_CHARS){
    text=text.substring(0,MAX_CHARS);
    truncated=true;
  }
  if(truncated)setStatus((t.pdfTooLarge||'Document truncated')+' | '+t.pdfAnalyzing,false);
  const prompt=buildPrompt(mode,text,question);
  try{
    await streamAsk(prompt,delta=>{
      acc+=delta;
      renderStreaming();
    });
    outEl.innerHTML=mdRender(acc);
    setStatus(t.pdfDone||'Done',false);
  }catch(err){
    if(err.name==='AbortError'){
      outEl.innerHTML=mdRender(acc)||'<div class="xa-empty">'+(t.pdfStopped||'Stopped')+'</div>';
      setStatus(t.pdfStopped||'Stopped',false);
    }else{
      outEl.innerHTML=mdRender(acc);
      setStatus((t.pdfFailed||'Failed')+': '+err.message,true);
    }
  }finally{
    aborter=null;
    stopBtn.style.display='none';
    updateRunBtn();
  }
}

/* ===== 事件绑定 ===== */
fi.onchange=async()=>{
  const files=fi.files;
  if(!files||!files.length){fileLoaded=false;textCache='';fileCount=0;fl.textContent=T().noFile||'';sheetsEl.textContent='';runBtn.disabled=true;container.querySelector('.xa-filelabel').classList.remove('has-file');hideProgress();return}
  const t=T();
  fl.textContent=files.length>1?(files.length+' '+(t.multiFilesLabel||'files')):files[0].name;
  try{
    sheetsEl.textContent=t.pdfParsing||'Loading PDF...';
    showProgress(t.pdfParsing||'Loading PDF...',5);
    const parts=[];fileCount=files.length;
    for(let i=0;i<files.length;i++){
      const f=files[i];
      const text=await parsePDF(f);
      if(files.length>1)parts.push('【文件：'+f.name+'】\n'+text);
      else parts.push(text);
    }
    textCache=parts.join('\n\n');
    fileLoaded=true;
    container.querySelector('.xa-filelabel').classList.add('has-file');
    hideProgress();
    const sizeKb=Math.round(textCache.length/1024);
    let infoTxt=(files.length>1?(files.length+' '+(t.multiFilesLabel||'files')):files[0].name)+' · '+sizeKb+' KB';
    const pages=(textCache.match(/--- Page \d+ ---/g)||[]).length;
    if(pages>0)infoTxt+=' · '+(t.pdfPages||'{n} pages').replace('{n}',pages);
    infoTxt+=' · '+(extractMethod==='Unstructured'?(t.pdfViaOCR||'via cloud OCR'):(t.pdfViaLocal||'via local extract'));
    if(textCache.length>MAX_CHARS)infoTxt+=' · '+(t.pdfWillTruncate||'will be truncated');
    sheetsEl.textContent=infoTxt;
    acc='';outEl.innerHTML='<div class="xa-empty">'+(t.pdfEmpty||'')+'</div>';setStatus('');
  }catch(err){
    fileLoaded=false;textCache='';fileCount=0;
    hideProgress();
    sheetsEl.innerHTML='<span style="color:#e53e3e">'+(t.pdfParseErr||'Parse failed')+': '+err.message+'</span>';
  }
  updateRunBtn();
};
runBtn.onclick=run;
stopBtn.onclick=()=>{if(aborter)aborter.abort()};

/* 初始化 */
buildModes();
applyText();
updateRunBtn();
})();
</script></body></html>
