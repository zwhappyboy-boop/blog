<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>周伊萱 · 家庭摄影</title>
  <style>
    :root {
      --bg-color: #fcfbf9;
      --card-bg: #ffffff;
      --text-main: #2c2c2c;
      --text-muted: #666666;
      --accent: #8c7b6c;
      --border-color: #f0ece9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Header Navigation */
    header {
      position: sticky;
      top: 0;
      background-color: rgba(252, 251, 249, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-main);
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: var(--accent);
    }

    /* Hero Section */
    .hero {
      position: relative;
      height: 70vh;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('hero-bg.png') center/cover no-repeat;
      color: #ffffff;
      padding: 0 1rem;
    }

    .hero-content h1 {
      font-size: 2.8rem;
      font-weight: 400;
      letter-spacing: 3px;
      margin-bottom: 0.8rem;
    }

    .hero-content p {
      font-size: 1.1rem;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    /* Section Structure */
    section {
      padding: 5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .section-title .subtitle {
      display: block;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .section-title h2 {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--text-main);
    }

    /* Portfolio Grid */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem;
    }

    .portfolio-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .portfolio-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .portfolio-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .card-info {
      padding: 1.5rem;
    }

    .card-info h3 {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .card-info p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border-color);
      padding: 2.5rem 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      background-color: var(--card-bg);
    }

    @media (max-width: 768px) {
      .hero-content h1 {
        font-size: 2rem;
      }
      section {
        padding: 3rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航栏 -->
  <header>
    <div class="nav-container">
      <a href="#home" class="logo">周伊萱</a>
      <nav>
        <a href="#home">首页</a>
        <a href="#portfolio">作品集</a>
      </nav>
    </div>
  </header>

  <!-- 顶部海报区域 -->
  <div class="hero" id="home">
    <div class="hero-content">
      <h1>记录爱与生活</h1>
      <p>用镜头定格岁月里最珍贵的温度</p>
    </div>
  </div>

  <!-- 作品集区域 -->
  <section id="portfolio">
    <div class="section-title">
      <span class="subtitle">PORTFOLIO</span>
      <h2>作品集</h2>
    </div>
    <div class="portfolio-grid">
      <div class="portfolio-card">
        <img src="family.jpg" alt="家庭">
        <div class="card-info">
          <h3>家庭</h3>
          <p>记录平凡生活里的感动与温情</p>
        </div>
      </div>
      <div class="portfolio-card">
        <img src="growth.jpg" alt="成长">
        <div class="card-info">
          <h3>成长</h3>
          <p>珍藏无忧无虑的纯真童年</p>
        </div>
      </div>
      <div class="portfolio-card">
        <img src="travel.jpg" alt="旅行">
        <div class="card-info">
          <h3>旅行</h3>
          <p>捕捉旅途风景与自然笑容</p>
        </div>
      </div>
      <div class="portfolio-card">
        <img src="anniversary.jpg" alt="纪念日">
        <div class="card-info">
          <h3>纪念日</h3>
          <p>定格爱与陪伴的岁月足迹</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 页脚版权信息 -->
  <footer>
    <p>© 2026 周伊萱 · 家庭摄影 | 用镜头，记录爱与生活</p>
  </footer>

</body>
</html>
